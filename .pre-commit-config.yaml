# Same gates locally (`pre-commit install`) and in CI (.github/workflows/ci.yml).
# Requires terraform, tflint and trivy on PATH, see README "Pre-commit hooks".
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL

  # Validating the root module also validates every child module it calls
  - repo: local
    hooks:
      - id: terraform-validate
        name: terraform validate (root module)
        entry: bash -c 'terraform -chdir=terraform init -backend=false -input=false > /dev/null && terraform -chdir=terraform validate'
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
