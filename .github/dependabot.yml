version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/modules/*
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /lambda
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /lambda
    schedule:
      interval: weekly
